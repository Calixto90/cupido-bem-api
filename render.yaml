databases:
  - name: cupido-bem-db
    plan: free
    databaseName: cupido_bem
    user: cupido_bem

services:
  - type: web
    name: cupido-bem-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask --app wsgi.py db upgrade && gunicorn --workers 1 --threads 4 wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cupido-bem-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
